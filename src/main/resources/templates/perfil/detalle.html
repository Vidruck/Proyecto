<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mi Perfil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand" href="/welcome">
            <i class="bi bi-arrow-left"></i> Volver al Dashboard
        </a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom">
                <div class="card-header-custom">
                    <h3>Mi Información</h3>
                    <p class="text-muted">Actualiza tus datos personales y credenciales.</p>
                </div>
                <div class="card-body p-4">

                    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show">
                        <span th:text="${mensajeExito}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form action="/perfil/actualizar" method="post" th:object="${perfilDto}">

                        <div class="mb-4 p-3 bg-light rounded border">
                            <label class="form-label text-muted small fw-bold">USUARIO / CORREO (No modificable)</label>
                            <input type="text" class="form-control-plaintext fw-bold" th:field="*{login}" readonly>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Nombre</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Primer Apellido</label>
                                <input type="text" class="form-control" th:field="*{primerApellido}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Segundo Apellido</label>
                                <input type="text" class="form-control" th:field="*{segundoApellido}">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" th:field="*{fechaNacimiento}" required>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="mb-3">
                            <label class="form-label fw-bold text-danger">Cambiar Contraseña</label>
                            <div class="input-group">
                                <input type="password" class="form-control" th:field="*{password}" id="newPass" placeholder="Dejar en blanco para mantener la actual">
                                <button type="button" class="btn btn-outline-secondary btn-toggle-password" data-target="newPass">👁️</button>
                            </div>
                            <div class="form-text">Si escribes aquí, tu contraseña se actualizará.</div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-ipn btn-lg">Guardar Cambios</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/security.js}"></script>

</body>
</html>
