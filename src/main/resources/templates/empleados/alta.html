<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Alta de Personal - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body> <nav class="navbar navbar-custom mb-4">
  <div class="container">
    <a class="navbar-brand" href="/welcome">
      <i class="bi bi-arrow-left"></i> Volver al Dashboard
    </a>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card card-custom">
        <div class="card-header-custom">
          <h3>Registrar Nuevo Talento</h3>
          <p class="text-muted">Da de alta un barbero y asígnalo a una sucursal.</p>
        </div>
        <div class="card-body p-4">

          <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <form action="/empleados/guardar" method="post" th:object="${empleadoDto}">

            <h6 class="text-muted text-uppercase fw-bold mb-3 small">Información Personal</h6>
            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Primer Apellido</label>
                <input type="text" class="form-control" th:field="*{primerApellido}" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Segundo Apellido</label>
                <input type="text" class="form-control" th:field="*{segundoApellido}">
              </div>

              <div class="col-md-6">
                <label class="form-label">Fecha Nacimiento</label>
                <input type="date" class="form-control" th:field="*{fechaNacimiento}" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Género</label>
                <select class="form-select" th:field="*{idGenero}">
                  <option value="0">Hombre</option>
                  <option value="1">Mujer</option>
                </select>
              </div>
            </div>

            <h6 class="text-muted text-uppercase fw-bold mb-3 small">Sucursal y Acceso</h6>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-bold text-primary">Asignar a Sucursal</label>
                <select class="form-select" th:field="*{idSucursal}" required>
                  <option value="" disabled selected>Selecciona una sucursal...</option>
                  <option th:each="s : ${sucursales}"
                          th:value="${s.id}"
                          th:text="${s.nombre} + ' (' + ${s.establecimiento.nombre} + ')'">
                  </option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label">Correo (Login)</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="barbero@upiicsa.mx" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Contraseña Temporal</label>
                <input type="password" class="form-control" th:field="*{password}" required>
              </div>
            </div>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-ipn btn-lg">Registrar Empleado</button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
