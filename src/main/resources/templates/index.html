<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Acceso al Sistema - IPN</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body class="login-layout">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="card card-custom">
                <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong th:text="${mensajeExito}"></strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card-header-custom">
                    <h1 class="mt-2">Bienvenido</h1>
                    <p class="text-muted fw-normal" style="font-size: 1rem; margin-top: 5px;">Ingresa tus credenciales para continuar</p>
                </div>

                <div class="card-body p-4">

                    <div th:if="${errorLogin}" class="alert alert-danger" role="alert">
                        <span th:text="${errorLogin}"></span>
                    </div>

                    <form action="/" th:object="${loginDto}" method="post">

                        <div class="mb-3">
                            <label class="form-label required fw-bold">Usuario</label>
                            <input type="text"
                                   class="form-control"
                                   name="username"
                                   th:field="*{username}"
                                   placeholder="Ingresa tu usuario"
                                   th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Contraseña</label>
                            <div class="input-group">
                                <input type="password" class="form-control" name="password" id="loginPassword" th:field="*{password}" placeholder="••••••••" th:errorclass="is-invalid"/>
                                <button type="button" class="btn btn-outline-secondary btn-toggle-password" data-target="loginPassword">👁️</button>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="d-grid gap-2">
                            <input type="submit" class="btn btn-ipn btn-lg" value="Ingresar"/>
                        </div>

                        <div class="text-center mt-3">
                            <span class="text-muted">¿No tienes cuenta?</span>
                            <a href="/signin" class="text-decoration-none fw-bold" style="color: var(--ipn-guinda);">Regístrate aquí</a>
                        </div>

                    </form>
                </div>
            </div>
            <div class="text-center mt-3 text-muted" style="font-size: 0.8rem;">
                &copy; 2026 POWERED by: Raven
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/security.js}"></script>
</body>
</html>
