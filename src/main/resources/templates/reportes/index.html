<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reportes y Métricas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav class="navbar navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand" href="/welcome">
            <i class="bi bi-arrow-left"></i> Volver al Dashboard
        </a>
    </div>
</nav>

<div class="container">
    <div class="welcome-header mb-4">
        <h1>Centro de Inteligencia</h1>
        <p class="text-muted">Métricas de rendimiento en tiempo real.</p>
    </div>

    <div class="row g-4">

        <div class="col-md-8">
            <div class="card card-custom h-100">
                <div class="card-header-custom text-start">
                    <h5 class="mb-0">Ganancias Totales (MXN)</h5>
                    <small class="text-muted">Desglose por sucursal operativa</small>
                </div>
                <div class="card-body">
                    <canvas id="chartGanancias"
                            th:data-labels="${jsonLblGanancias}"
                            th:data-values="${jsonValGanancias}">
                    </canvas>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card card-custom h-100">
                <div class="card-header-custom text-start">
                    <h5 class="mb-0">Servicios Top</h5>
                    <small class="text-muted">Preferencia de clientes</small>
                </div>
                <div class="card-body d-flex align-items-center justify-content-center">
                    <div style="width: 100%; max-width: 300px;">
                        <canvas id="chartServicios"
                                th:data-labels="${jsonLblTop}"
                                th:data-values="${jsonValTop}">
                        </canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/reportes.js}"></script>

</body>
</html>
