<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Alta de Sucursal - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        #map {
            height: 400px;
            width: 100%;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            z-index: 1; /* Asegura que no tape dropdowns si los hubiera */
        }
    </style>
</head>
<body>

<nav class="navbar navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-arrow-left"></i> Volver al Dashboard
        </a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom">
                <div class="card-header-custom">
                    <h3>Nueva Sucursal</h3>
                    <p class="text-muted">Ingresa los datos y selecciona la ubicación en el mapa.</p>
                </div>
                <div class="card-body p-4">

                    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show">
                        <span th:text="${mensajeExito}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form action="/establecimientos/guardar" method="post" th:object="${sucursalDto}">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Nombre del Negocio</label>
                                <input type="text" class="form-control" th:field="*{nombreEstablecimiento}" placeholder="Ej. Barbería UPIICSA" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Nombre de Sucursal</label>
                                <input type="text" class="form-control" th:field="*{nombreSucursal}" placeholder="Ej. Centro Histórico" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Ubicación</label>
                            <div id="map"></div>
                            <small class="text-muted mt-2 d-block">
                                Coordenadas seleccionadas: <span id="coords-display" class="fw-bold">Haz clic en el mapa</span>
                            </small>
                        </div>

                        <input type="hidden" id="lat" th:field="*{latitud}">
                        <input type="hidden" id="lng" th:field="*{longitud}">

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-ipn btn-lg">Registrar Sucursal</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/map-alta.js}"></script>

</body>
</html>
