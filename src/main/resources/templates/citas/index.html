<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mis Citas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand" href="/welcome">
            <i class="bi bi-arrow-left"></i> Volver al Dashboard
        </a>
    </div>
</nav>

<div class="container">
    <div class="card card-custom">
        <div class="card-header-custom d-flex justify-content-between align-items-center">
            <h3>Mis Citas</h3>
            <a href="/citas/agendar" class="btn btn-ipn btn-sm">
                <i class="bi bi-plus-lg"></i> Nueva Cita
            </a>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="color: var(--text-color);">
                    <thead style="background-color: var(--bg-color);">
                    <tr>
                        <th class="p-3">Servicio</th>
                        <th>Sucursal</th>
                        <th>Estado</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cita : ${citas}">
                        <td class="p-3">
                                <span class="fw-bold d-block"
                                      th:text="${cita.servicio != null ? cita.servicio.nombre : 'Servicio #' + cita.idServicio}">
                                </span>
                        </td>
                        <td th:text="${cita.sucursal != null ? cita.sucursal.nombre : 'Sucursal #' + cita.idSucursal}"></td>
                        <td>
                            <span th:if="${cita.pagado == true}" class="badge bg-success">Pagado</span>
                            <span th:unless="${cita.pagado == true}" class="badge bg-secondary">Pendiente</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(citas)}">
                        <td colspan="3" class="text-center p-4 text-muted">No tienes citas registradas.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
