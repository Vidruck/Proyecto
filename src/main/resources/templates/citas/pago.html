<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirmar y Pagar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom">
                <div class="card-header-custom">
                    <h3>Resumen de Cita</h3>
                </div>
                <div class="card-body p-4">

                    <div class="alert alert-info d-flex align-items-center">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <div>Estás a un paso. Confirma los datos y realiza el pago.</div>
                    </div>

                    <ul class="list-group list-group-flush mb-4 rounded border">
                        <li class="list-group-item d-flex justify-content-between bg-transparent text-white">
                            <span>Servicio:</span>
                            <strong th:text="${servicio.nombre}">Corte</strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between bg-transparent text-white">
                            <span>Fecha:</span>
                            <strong th:text="${citaDto.fecha}">2026-01-01</strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between bg-transparent text-white">
                            <span>Hora:</span>
                            <strong th:text="${citaDto.hora}">12:00</strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between bg-transparent text-white fw-bold">
                            <span>Total a Pagar:</span>
                            <span class="text-success">$150.00 MXN</span>
                        </li>
                    </ul>

                    <h6 class="text-muted text-uppercase fw-bold mb-3 small">Método de Pago</h6>
                    <form action="/citas/finalizar" method="post">
                        <input type="hidden" name="idServicio" th:value="${citaDto.idServicio}">
                        <input type="hidden" name="fecha" th:value="${citaDto.fecha}">
                        <input type="hidden" name="hora" th:value="${citaDto.hora}">

                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Nombre en la tarjeta" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="0000 0000 0000 0000" maxlength="19" required>
                        </div>
                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <input type="text" class="form-control" placeholder="MM/YY" maxlength="5" required>
                            </div>
                            <div class="col-6">
                                <input type="text" class="form-control" placeholder="CVC" maxlength="3" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">Pagar y Confirmar</button>
                            <a href="/citas/agendar" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
