<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Sucursales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="navbar navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand" href="/welcome"><i class="bi bi-arrow-left"></i> Volver al Dashboard</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2><i class="bi bi-shop"></i> Sucursales</h2>
            <p class="text-muted">Administra las ubicaciones físicas.</p>
        </div>

        <a href="/sucursales/alta" class="btn btn-success btn-lg shadow">
            <i class="bi bi-geo-alt"></i> Nueva Sucursal
        </a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle"></i> <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card card-custom">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Nombre</th>
                        <th>Coordenadas</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${sucursales}">
                        <td class="ps-4 fw-bold text-muted" th:text="${s.id}">1</td>
                        <td>
                            <div class="fw-bold" th:text="${s.nombre}">Centro</div>
                            <small class="text-muted">UPIICSA</small>
                        </td>
                        <td class="text-muted small font-monospace">
                            <i class="bi bi-pin-map text-danger"></i>
                            <span th:text="${s.ubicacion}">POINT(...)</span>
                        </td>
                        <td class="text-end pe-4">
                            <form action="/sucursales/eliminar" method="post"
                                  onsubmit="return confirm('¿Seguro que deseas eliminar esta sucursal?');">
                                <input type="hidden" name="id" th:value="${s.id}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i> Borrar
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sucursales)}">
                        <td colspan="4" class="text-center py-5 text-muted">
                            <i class="bi bi-shop display-4 d-block mb-3"></i>
                            No hay sucursales registradas.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
