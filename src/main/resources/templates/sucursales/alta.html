<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nueva Sucursal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        #map { height: 400px; width: 100%; border-radius: 8px; border: 2px solid #eee; }
    </style>
</head>
<body>
<nav class="navbar navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand" href="/sucursales"><i class="bi bi-arrow-left"></i> Volver a la Lista</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom">
                <div class="card-header-custom">
                    <h3><i class="bi bi-geo-alt-fill"></i> Nueva Sucursal</h3>
                    <p class="mb-0 text-white-50">Indica el nombre y selecciona la ubicación en el mapa.</p>
                </div>
                <div class="card-body p-4">

                    <form action="/sucursales/guardar" method="post" th:object="${sucursalDto}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre de la Sucursal</label>
                            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej. Sucursal Norte" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Ubicación (Haz clic en el mapa)</label>
                            <div id="map"></div>
                            <div class="form-text text-muted">Arrastra el mapa y haz clic para poner el marcador.</div>
                        </div>

                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <label class="small text-muted">Latitud</label>
                                <input type="text" id="latitud" name="latitud" class="form-control form-control-sm" readonly required>
                            </div>
                            <div class="col-6">
                                <label class="small text-muted">Longitud</label>
                                <input type="text" id="longitud" name="longitud" class="form-control form-control-sm" readonly required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="/sucursales" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-save"></i> Guardar Ubicación
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/map-alta.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
