<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Gestión de Servicios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="navbar navbar-custom mb-4">
  <div class="container">
    <a class="navbar-brand" href="/welcome"><i class="bi bi-arrow-left"></i> Volver al Dashboard</a>
  </div>
</nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2><i class="bi bi-scissors"></i> Catálogo de Servicios</h2>
      <p class="text-muted">Administra tus paquetes y ofertas vigentes.</p>
    </div>

    <a href="/servicios/alta" class="btn btn-primary btn-lg shadow">
      <i class="bi bi-plus-circle-fill"></i> Nuevo Servicio
    </a>
  </div>

  <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show">
    <i class="bi bi-check-circle"></i> <span th:text="${mensajeExito}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="row g-4">
    <div th:each="s : ${servicios}" class="col-md-4">
      <div class="card h-100 shadow-sm transition-hover"
           th:classappend="${s.activo == 0} ? 'opacity-75 bg-light' : 'card-custom'">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="card-title fw-bold m-0" th:text="${s.nombre}">Corte</h5>
            <span th:if="${s.activo == 1}" class="badge bg-success">Activo</span>
            <span th:unless="${s.activo == 1}" class="badge bg-secondary">Inactivo</span>
          </div>

          <p class="card-text text-muted small" th:text="${s.descripcion}">...</p>

          <div class="d-flex align-items-center text-muted mb-3">
            <i class="bi bi-clock me-2"></i> <span th:text="${s.duracion}"></span> min
          </div>
        </div>

        <div class="card-footer bg-transparent border-0 text-end">
          <form action="/servicios/cambiar-estado" method="post">
            <input type="hidden" name="id" th:value="${s.id}">
            <button th:if="${s.activo == 1}" class="btn btn-sm btn-outline-danger" title="Ocultar del menú">
              <i class="bi bi-eye-slash"></i> Desactivar
            </button>
            <button th:unless="${s.activo == 1}" class="btn btn-sm btn-outline-success" title="Mostrar en menú">
              <i class="bi bi-eye"></i> Reactivar
            </button>
          </form>
        </div>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(servicios)}" class="col-md-4">
      <a href="/servicios/alta" class="card h-100 border-dashed d-flex align-items-center justify-content-center text-decoration-none text-muted p-5">
        <div class="text-center">
          <i class="bi bi-plus-circle display-4"></i>
          <p class="mt-2">Agregar el primero</p>
        </div>
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
