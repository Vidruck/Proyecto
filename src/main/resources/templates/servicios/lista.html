<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Gestión de Servicios y Paquetes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="navbar navbar-custom mb-4">
  <div class="container">
    <a class="navbar-brand" href="/welcome"><i class="bi bi-arrow-left"></i> Volver al Inicio</a>
  </div>
</nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-scissors"></i> Catálogo de Servicios</h2>
    <a href="/servicios/alta" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nuevo Paquete</a>
  </div>

  <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${mensajeExito}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="row">
    <div th:each="s : ${servicios}" class="col-md-4 mb-4">
      <div class="card h-100 shadow-sm" th:classappend="${s.activo == 0} ? 'bg-light text-muted border-secondary' : 'card-custom'">
        <div class="card-body">
          <div class="d-flex justify-content-between">
            <h5 class="card-title fw-bold" th:text="${s.nombre}">Corte</h5>

            <span th:if="${s.activo == 1}" class="badge bg-success">Activo</span>
            <span th:unless="${s.activo == 1}" class="badge bg-secondary">Inactivo</span>
          </div>

          <p class="card-text mt-2" th:text="${s.descripcion}">Descripción...</p>
          <p class="small"><i class="bi bi-clock"></i> Duración: <span th:text="${s.duracion}">45</span> min</p>
        </div>

        <div class="card-footer bg-transparent border-0 d-flex justify-content-end">
          <form action="/servicios/cambiar-estado" method="post">
            <input type="hidden" name="id" th:value="${s.id}">

            <button th:if="${s.activo == 1}" type="submit" class="btn btn-sm btn-outline-danger" title="Desactivar oferta">
              <i class="bi bi-eye-slash"></i> Desactivar
            </button>

            <button th:unless="${s.activo == 1}" type="submit" class="btn btn-sm btn-outline-success" title="Reactivar oferta">
              <i class="bi bi-eye"></i> Reactivar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
